<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlex</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row gx-4">
            <aside class="col-md-3">
                <div class="sidebar p-4">
                    <div class="logo mb-4 text-center">
                        <img src="images/logo.png" alt="MovieFlux" class="img-fluid" />
                    </div>
                    <nav class="nav-menu">
                        <ul>
                            <li class="active"><span class="text"><i class="fa-regular fa-house"></i>Home</span></li>
                            <li> <span class="text">Explore</span></li>
                            <li> <span class="text">Favourites</span></li>
                        </ul>
                    </nav>
                </div>
            </aside>

            <main class="col-md-9">
                <div class="topbar d-flex align-items-center justify-content-between mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <select class="form-select form-select-sm" style="width:110px;">
                            <option>All <i class="fa-solid fa-chevron-down"></i></option>
                            <option>Movies</option>
                            <option>Series</option>
                        </select>
                        <div class="search-bar ms-2">
                            <input  class="form-control form-control-sm" placeholder="Search" />
                        </div>
                    </div>
                    <div class="top-icons text-muted">
                        <i class="bi bi-person-circle"></i>
                    </div>
                </div>

                <div class="hero-card">
                    <div class="hero-overlay">
                        <div class="tags mb-2">
                            <span class="badge  text-dark">Drama</span>
                            <span class="badge  text-dark ms-2">Fantasy</span>
                        </div>
                        <h1 class="hero-title">MOVKA</h1>
                        <p class="hero-desc">Young and naive forest spirit Mavka, develops feelings for a human musician, Lukas. As they grow closer to each other, an inevitable situation forces Mavka to choose between her love and her duty as a guardian of the forest.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>


    <script src="js/all.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
